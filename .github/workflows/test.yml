name: Tests
on:
  pull_request:
    branches: [ main ]
jobs:
  elm-pages-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-node
    - uses: ./.github/actions/cache-elm

    - name: Install dependencies
      run: npm ci

    - name: Build
      run : npm run build > /dev/null

  ts-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-node
    - uses: ./.github/actions/cache-elm

    - name: Install dependencies
      run: npm ci

    - name: Build
      run : npm run test:ts

  elm-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-node
    - uses: ./.github/actions/cache-elm

    - name: Install dependencies
      run: npm ci

    - name: Build
      run : npm run test:elm

  database-types-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-node
    - name: Install dependencies
      run: npm ci
    - name: Build
      run : npm run db:verify

  type-check-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-node
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npx tsc

  playwright-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-node

    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npm run test:e2e
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
